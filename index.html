<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파주시청 부서 조직도 생성기</title>
<script src="vendor/html2canvas.min.js"></script>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('Pretendard');
  }
  * { box-sizing: border-box; }
  :root{
    --navy: #14243f;
    --navy-2: #1f3a5f;
    --paper: #f5f3ee;
    --paper-2: #eceae2;
    --line: #d8d3c6;
    --gold: #b8934a;
    --ink: #21262c;
    --muted: #6b7178;
    --card: #ffffff;
    --danger: #a33c3c;
    --radius: 4px;
  }
  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
  }

  /* ===== 좌측 패널 ===== */
  .panel {
    background: var(--navy);
    color: #e8e6df;
    padding: 28px 24px 60px;
    overflow-y: auto;
    max-height: 100vh;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  .brand-eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .brand-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 22px;
    letter-spacing: -0.01em;
    line-height: 1.35;
  }

  .field-group { margin-bottom: 18px; }
  .field-label {
    display: block;
    font-size: 11.5px;
    color: #a9b0bd;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field-input, .field-select {
    width: 100%;
    padding: 9px 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: var(--radius);
    color: #f2f1ec;
    font-size: 13.5px;
    font-family: inherit;
  }
  .field-input::placeholder { color: #7c8494; }
  .field-input:focus, .field-select:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(255,255,255,0.09);
  }
  .field-select option { background: var(--navy-2); color: #fff; }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .photo-upload {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .photo-preview {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
  }
  .photo-btn {
    font-size: 12px;
    padding: 7px 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius);
    color: #e8e6df;
    cursor: pointer;
  }
  .photo-btn:hover { background: rgba(255,255,255,0.14); }
  input[type=file] { display: none; }

  .btn-primary {
    width: 100%;
    padding: 11px;
    background: var(--gold);
    color: #24190a;
    border: none;
    border-radius: var(--radius);
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.01em;
  }
  .btn-primary:hover { background: #c7a35c; }
  .btn-secondary {
    width: 100%;
    padding: 10px;
    background: transparent;
    color: #cfd3da;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: var(--radius);
    font-size: 12.5px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-secondary:hover { border-color: rgba(255,255,255,0.5); }

  .divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.14);
    margin: 26px 0 20px;
  }

  #editFormArea {
    border-radius: var(--radius);
    transition: box-shadow 0.3s ease, background 0.3s ease;
    padding: 2px;
    margin: -2px;
  }
  #editFormArea.editing-highlight {
    box-shadow: 0 0 0 2px var(--gold);
    background: rgba(184,147,74,0.08);
  }

  .toast {
    position: fixed;
    left: 24px;
    bottom: 24px;
    max-width: 330px;
    background: #2a2118;
    color: #f2ede0;
    border-left: 3px solid var(--gold);
    padding: 12px 16px;
    font-size: 13px;
    border-radius: var(--radius);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    z-index: 999;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .toast.toast-danger { border-left-color: var(--danger); }

  .delete-confirm-btn {
    color: #fff !important;
    background: var(--danger);
    border-radius: 3px;
    padding: 2px 6px !important;
    font-size: 11px !important;
  }

  .list-title {
    font-size: 12px;
    color: #a9b0bd;
    margin-bottom: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .person-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-radius: var(--radius);
    margin-bottom: 4px;
  }
  .person-row:hover { background: rgba(255,255,255,0.05); }
  .person-row .thumb {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.1); background-size: cover; background-position: center;
    flex-shrink: 0;
  }
  .person-row .meta { flex: 1; min-width: 0; }
  .person-row .meta .nm { font-size: 13px; font-weight: 600; color: #f2f1ec; }
  .person-row .meta .rl { font-size: 11px; color: #8f97a3; }
  .row-actions button {
    background: none; border: none; color: #8f97a3; cursor: pointer; font-size: 12px; padding: 2px 4px;
  }
  .row-actions button:hover { color: #e8e6df; }
  .row-actions button:disabled { opacity: 0.25; cursor: default; }
  .row-actions button:disabled:hover { color: #8f97a3; }

  .hint-note { color: #8f97a3; font-size: 12px; padding: 4px 2px; }

  .warn-note {
    background: rgba(163,60,60,0.16);
    border: 1px solid rgba(163,60,60,0.45);
    color: #f0cccc;
    font-size: 11.5px;
    line-height: 1.5;
    padding: 8px 10px;
    border-radius: var(--radius);
    margin-top: 10px;
  }
  .warn-note div + div { margin-top: 5px; }

  .export-bar { display: flex; gap: 8px; }
  .export-bar .btn-secondary { margin-top: 0; }

  /* ===== 우측 조직도 캔버스 ===== */
  .canvas-wrap {
    padding: 40px 48px 80px;
    display: flex;
    justify-content: center;
  }
  #chart {
    width: 100%;
    max-width: 1040px;
    aspect-ratio: 297 / 210;   /* A4 가로 비율 (내용이 길면 자동으로 늘어남) */
    background: var(--card);
    padding: 48px 40px 56px;
    border: 1px solid var(--line);
  }
  .chart-header {
    text-align: center;
    margin-bottom: 6px;
  }
  .chart-eyebrow {
    font-size: 10.5px;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 700;
  }
  .chart-dept-name {
    font-size: 26px;
    font-weight: 800;
    color: var(--navy);
    margin: 4px 0 34px;
    letter-spacing: -0.01em;
  }

  .head-row { display: flex; justify-content: center; margin-bottom: 6px; }
  .connector-v {
    width: 1px;
    height: 26px;
    background: var(--line);
    margin: 0 auto;
  }
  .teams-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
    row-gap: 36px;
    position: relative;
    margin-top: 0;
  }
  .team-col {
    flex: 1;
    max-width: 320px;
    padding: 0 14px;
    position: relative;
  }
  .team-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -0.005em;
    height: 18px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 0 6px;
  }
  .team-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .team-col::before {
    content: '';
    position: absolute;
    top: -26px; left: 50%;
    width: 1px; height: 26px;
    background: var(--line);
  }
  .h-bridge {
    position: relative;
    height: 26px;
    margin-bottom: 0;
  }
  .h-bridge::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: var(--line);
  }

  .lead-connector { width: 1px; height: 18px; background: var(--line); margin: 0 auto; }

  .card-person {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
    position: relative;
  }
  .card-head {
    width: 320px;
    margin: 0 auto 0;
    border-color: var(--navy);
    border-width: 1.5px;
    padding: 18px 20px;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card-lead {
    margin-bottom: 0;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card-member {
    margin-bottom: 10px;
    min-height: 176px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    margin: 0 auto 10px;
    background: var(--paper-2);
    background-size: cover;
    background-position: center;
    border: 1px solid var(--line);
  }
  .card-head .avatar { width: 68px; height: 68px; }

  .p-name {
    font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .card-head .p-name { font-size: 17px; }
  .p-role {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--navy-2);
    background: #eef1f6;
    border-radius: 2px;
    padding: 2px 7px;
    margin-bottom: 7px;
  }
  .role-과장 { color: #7a5a13; background: #fbf1dd; }
  .role-팀장 { color: var(--navy-2); background: #eef1f6; }
  .role-팀원 { color: #4c5762; background: #f1f1ee; }

  .p-team { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .p-phone {
    font-size: 12px; color: var(--ink);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .p-phone::before { content: '☎ '; color: var(--muted); }
  .p-dong {
    margin-top: 7px;
    display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
    max-height: 42px;
    overflow-y: auto;
  }
  .dong-tag {
    font-size: 10px;
    background: var(--paper-2);
    color: var(--navy-2);
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid var(--line);
  }

  .members-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

  .empty-note {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 60px 0;
  }

  .footer-strip {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="app">
  <!-- ===== 좌측: 데이터 입력 패널 (내보낼 이미지에서 제외됨) ===== -->
  <div class="panel" id="panel">
    <div class="brand-eyebrow">파주시청</div>
    <h1 class="brand-title">부서 조직도 생성기</h1>

    <div class="field-group">
      <label class="field-label" for="deptName">과 이름</label>
      <input class="field-input" id="deptName" placeholder="예: 허가3과" value="허가3과">
    </div>

    <hr class="divider">

    <!-- 과장 (과 대표) -->
    <div class="list-title">과장 (과 대표)</div>
    <div class="row-2 field-group">
      <div>
        <label class="field-label" for="headName">이름</label>
        <input class="field-input" id="headName" placeholder="예: 김건축">
      </div>
      <div>
        <label class="field-label" for="headPhone">행정전화번호</label>
        <input class="field-input" id="headPhone" placeholder="031-940-0000">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">과장 사진</label>
      <div class="photo-upload">
        <div class="photo-preview" id="headPhotoPreview"></div>
        <label class="photo-btn" for="headPhotoFile">사진 선택</label>
        <input type="file" id="headPhotoFile" accept="image/*">
        <button class="photo-btn" type="button" id="headPhotoClear">제거</button>
      </div>
    </div>

    <hr class="divider">

    <!-- 1) 팀 만들기 -->
    <div class="list-title">1) 팀 만들기 (순서대로)</div>
    <div class="field-group">
      <label class="field-label" for="teamNameInput">팀명</label>
      <input class="field-input" id="teamNameInput" placeholder="예: 건축신고팀">
    </div>
    <button class="btn-primary" id="addTeamBtn">+ 팀 추가</button>
    <button class="btn-secondary" id="cancelTeamEditBtn" style="display:none;">팀명 수정 취소</button>
    <div id="teamList" style="margin-top:12px;"></div>

    <hr class="divider">

    <!-- 2) 팀장·팀원 추가 -->
    <div class="list-title">2) 팀장 · 팀원 추가</div>
    <div id="editFormArea">

    <div class="field-group">
      <label class="field-label" for="mTeam">소속 팀</label>
      <select class="field-select" id="mTeam"></select>
    </div>

    <div class="field-group">
      <label class="field-label" for="mRole">직급</label>
      <select class="field-select" id="mRole">
        <option value="팀장">팀장</option>
        <option value="팀원">팀원</option>
      </select>
    </div>

    <div class="row-2 field-group">
      <div>
        <label class="field-label" for="mName">이름</label>
        <input class="field-input" id="mName" placeholder="홍길동">
      </div>
      <div>
        <label class="field-label" for="mPhone">행정전화번호</label>
        <input class="field-input" id="mPhone" placeholder="031-940-0000">
      </div>
    </div>

    <div class="field-group" id="mDongGroup">
      <label class="field-label" for="mDong">담당 동/읍/면 (쉼표로 구분, 팀원만)</label>
      <input class="field-input" id="mDong" placeholder="예: 금촌동, 조리읍">
    </div>

    <div class="field-group">
      <label class="field-label">사진</label>
      <div class="photo-upload">
        <div class="photo-preview" id="mPhotoPreview"></div>
        <label class="photo-btn" for="mPhotoFile">사진 선택</label>
        <input type="file" id="mPhotoFile" accept="image/*">
      </div>
    </div>

    <button class="btn-primary" id="saveMemberBtn">+ 조직도에 추가</button>
    <button class="btn-secondary" id="cancelMemberEditBtn" style="display:none;">수정 취소</button>
    </div>

    <hr class="divider">

    <div class="list-title">현재 구성원 (<span id="countLabel">0</span>명)</div>
    <div id="personList"></div>
    <div id="warnArea" class="warn-note" style="display:none;"></div>
    <button class="btn-secondary" id="resetAllBtn">🗑 전체 초기화</button>

    <hr class="divider">

    <div class="list-title">저장 / 내보내기</div>
    <div class="export-bar">
      <button class="btn-secondary" id="exportJsonBtn">📄 데이터 저장(JSON)</button>
      <button class="btn-secondary" id="importJsonBtn">📂 불러오기</button>
    </div>
    <input type="file" id="importJsonFile" accept="application/json">
    <button class="btn-primary" id="exportPngBtn" style="margin-top:14px;">🖼 조직도 이미지로 저장</button>
    <button class="btn-primary" id="printBtn" style="margin-top:8px;">🖨 A4로 출력(인쇄)</button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ===== 우측: 조직도 미리보기 (이미지로 내보내지는 영역) ===== -->
  <div class="canvas-wrap">
    <div id="chart">
      <div class="chart-header">
        <div class="chart-eyebrow">Paju City Hall · Organization Chart</div>
        <div class="chart-dept-name" id="chartDeptName">허가3과</div>
      </div>
      <div id="chartBody"></div>
      <div class="footer-strip">
        <span id="chartMeta"></span>
      </div>
    </div>
  </div>
</div>

<script>
// ===== 데이터 (팀 중심 구조) =====
// head: 과장(1명), teams: 순서 있는 팀 목록, members: 팀 소속 구성원
let head = { name: '김건축', phone: '031-940-1001', photo: '' };
let teams = [
  { id: 1, name: '건축신고팀' },
  { id: 2, name: '건축인허가팀' },
];
let members = [
  { id: 1, teamId: 1, role: '팀장', name: '박기준', phone: '031-940-1011', dong: [], photo: '' },
  { id: 2, teamId: 1, role: '팀원', name: '이형욱', phone: '031-940-1012', dong: ['금촌동','조리읍'], photo: '' },
  { id: 3, teamId: 1, role: '팀원', name: '최민수', phone: '031-940-1013', dong: ['교하동'], photo: '' },
  { id: 4, teamId: 2, role: '팀장', name: '정도시', phone: '031-940-1021', dong: [], photo: '' },
  { id: 5, teamId: 2, role: '팀원', name: '오하나', phone: '031-940-1022', dong: ['운정1동','운정2동'], photo: '' },
];
let nextTeamId = 3;
let nextMemberId = 6;

let editingTeamId = null;
let editingMemberId = null;
let memberPhoto = '';           // 구성원 입력 폼의 현재 사진
let pendingDeleteId = null;
let pendingDeleteTimer = null;

const $ = (id) => document.getElementById(id);

// HTML 컨텍스트 삽입 시 XSS 방지
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 사진 URL 검증: 업로드 이미지(data:image;base64) 또는 http(s)만 허용,
// CSS url() 컨텍스트를 깨는 문자는 제거
function safePhoto(p) {
  if (typeof p !== 'string') return '';
  const s = p.trim();
  if (!/^(data:image\/(png|jpe?g|gif|webp|bmp|svg\+xml);base64,|https?:\/\/)/i.test(s)) return '';
  return s.replace(/["'()\\\s<>]/g, '');
}

// 업로드 이미지를 정사각 축소 후 JPEG로 압축 (저장/JSON 용량 절감)
function resizePhoto(dataUrl, maxSize) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      try { resolve(canvas.toDataURL('image/jpeg', 0.85)); }
      catch (e) { resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// 외부 데이터(불러오기/localStorage)를 안전한 구조로 정규화
function normalizeState(data) {
  const h = (data && data.head) || {};
  head = {
    name: String(h.name == null ? '' : h.name).trim(),
    phone: String(h.phone == null ? '' : h.phone).trim(),
    photo: safePhoto(h.photo),
  };
  teams = Array.isArray(data && data.teams) ? data.teams.map((t, i) => ({
    id: Number.isFinite(Number(t && t.id)) ? Number(t.id) : Date.now() + i,
    name: String(t && t.name != null ? t.name : '').trim(),
  })).filter(t => t.name) : [];
  const teamIds = new Set(teams.map(t => t.id));
  members = Array.isArray(data && data.members) ? data.members.map((m, i) => {
    const role = m && m.role === '팀장' ? '팀장' : '팀원';
    return {
      id: Number.isFinite(Number(m && m.id)) ? Number(m.id) : Date.now() + 1000 + i,
      teamId: Number(m && m.teamId),
      role,
      name: String(m && m.name != null ? m.name : '').trim(),
      phone: String(m && m.phone != null ? m.phone : '').trim(),
      dong: role === '팀원' && Array.isArray(m && m.dong)
        ? m.dong.map(d => String(d).trim()).filter(Boolean) : [],
      photo: safePhoto(m && m.photo),
    };
  }).filter(m => teamIds.has(m.teamId)) : [];
  nextTeamId = teams.reduce((a, t) => Math.max(a, t.id), 0) + 1;
  nextMemberId = members.reduce((a, m) => Math.max(a, m.id), 0) + 1;
}

// ===== localStorage 자동 저장 / 복원 =====
const STORAGE_KEY = 'pajuOrgChart_v2';
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      deptName: $('deptName').value, head, teams, members,
    }));
  } catch (e) { /* 용량 초과 등은 무시 */ }
}
function restoreState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return;
    if (typeof data.deptName === 'string') $('deptName').value = data.deptName;
    normalizeState(data);
  } catch (e) { /* 손상된 저장값은 무시 */ }
}

function showToast(message, danger) {
  const toast = $('toast');
  toast.textContent = message;
  toast.className = 'toast show' + (danger ? ' toast-danger' : '');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.className = 'toast'; }, 2800);
}

const TEAM_COLORS = ['#2f6f4f', '#6a4c93', '#1f6f78', '#9c4b3e', '#8a6d1f', '#3d5a80'];
function teamColor(team) {
  let hash = 0;
  for (let i = 0; i < team.length; i++) hash = (hash * 31 + team.charCodeAt(i)) >>> 0;
  return TEAM_COLORS[hash % TEAM_COLORS.length];
}

function avatarStyle(photo, extra) {
  const sp = safePhoto(photo);
  const bg = sp ? `background-image:url('${sp}');` : '';
  return `style="${extra || ''}${bg}"`;
}

function syncHeadFields() {
  $('headName').value = head.name;
  $('headPhone').value = head.phone;
  $('headPhotoPreview').style.backgroundImage = head.photo ? `url('${head.photo}')` : '';
}
$('headName').addEventListener('input', () => { head.name = $('headName').value; renderChart(); saveState(); });
$('headPhone').addEventListener('input', () => { head.phone = $('headPhone').value; renderChart(); saveState(); });
$('headPhotoFile').addEventListener('change', (e) => {

// ===== 팀 관리 =====
function renderTeamList() {
  const wrap = $('teamList');
  wrap.innerHTML = '';
  if (!teams.length) {
    wrap.innerHTML = '<div class="hint-note">아직 팀이 없습니다. 팀을 먼저 추가하세요.</div>';
    return;
  }
  teams.forEach((t, i) => {
    const color = teamColor(t.name);
    const cnt = members.filter(m => m.teamId === t.id).length;
    const row = document.createElement('div');
    row.className = 'person-row';
    row.innerHTML = `
      <span class="team-dot" style="background:${color};margin-left:4px;"></span>
      <div class="meta">
        <div class="nm">${esc(t.name)}</div>
        <div class="rl">${cnt}명</div>
      </div>
      <div class="row-actions">
        <button onclick="moveTeam(${t.id}, -1)" title="위로" aria-label="${esc(t.name)} 위로 이동" ${i === 0 ? 'disabled' : ''}>▲</button>
        <button onclick="moveTeam(${t.id}, 1)" title="아래로" aria-label="${esc(t.name)} 아래로 이동" ${i === teams.length - 1 ? 'disabled' : ''}>▼</button>
        <button onclick="editTeam(${t.id})" title="팀명 수정" aria-label="${esc(t.name)} 팀명 수정">✎</button>
        <button onclick="deleteTeam(${t.id})" title="팀 삭제" aria-label="${esc(t.name)} 삭제">✕</button>
      </div>`;
    wrap.appendChild(row);
  });
}

$('addTeamBtn').addEventListener('click', () => {
  const name = $('teamNameInput').value.trim();
  if (!name) { showToast('팀명을 입력해주세요.', true); return; }
  if (editingTeamId) {
    const t = teams.find(x => x.id === editingTeamId);
    if (teams.some(x => x.id !== editingTeamId && x.name === name)) {
      showToast('이미 있는 팀명입니다.', true); return;
    }
    if (t) t.name = name;
    cancelTeamEdit();
  } else {
    if (teams.some(t => t.name === name)) { showToast('이미 있는 팀명입니다.', true); return; }
    teams.push({ id: nextTeamId++, name });
  }
  $('teamNameInput').value = '';
  render();
});

function editTeam(id) {
  const t = teams.find(x => x.id === id);
  if (!t) return;
  editingTeamId = id;
  $('teamNameInput').value = t.name;
  $('teamNameInput').focus();
  $('addTeamBtn').textContent = '✓ 팀명 수정';
  $('cancelTeamEditBtn').style.display = 'block';
}
function cancelTeamEdit() {
  editingTeamId = null;
  $('teamNameInput').value = '';
  $('addTeamBtn').textContent = '+ 팀 추가';
  $('cancelTeamEditBtn').style.display = 'none';
}
$('cancelTeamEditBtn').addEventListener('click', cancelTeamEdit);

function moveTeam(id, dir) {
  const idx = teams.findIndex(t => t.id === id);
  if (idx === -1) return;
  const target = idx + dir;
  if (target < 0 || target >= teams.length) return;
  [teams[idx], teams[target]] = [teams[target], teams[idx]];
  render();
}

function deleteTeam(id) {
  const t = teams.find(x => x.id === id);
  if (!t) return;
  const cnt = members.filter(m => m.teamId === id).length;
  const msg = cnt
    ? `'${t.name}' 팀과 소속 구성원 ${cnt}명을 모두 삭제할까요?`
    : `'${t.name}' 팀을 삭제할까요?`;
  if (!confirm(msg + '\n되돌릴 수 없습니다.')) return;
  teams = teams.filter(x => x.id !== id);
  members = members.filter(m => m.teamId !== id);
  if (editingTeamId === id) cancelTeamEdit();
  render();
  showToast(`'${t.name}' 팀이 삭제되었습니다.`);
}

// ===== 구성원 (팀장/팀원) =====
function renderMemberTeamOptions() {
  const sel = $('mTeam');
  const prev = sel.value;
  sel.innerHTML = teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  if (teams.some(t => String(t.id) === prev)) sel.value = prev;
}

function updateMemberRoleVisibility() {
  $('mDongGroup').style.display = $('mRole').value === '팀원' ? 'block' : 'none';
}
$('mRole').addEventListener('change', updateMemberRoleVisibility);

$('mPhotoFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    memberPhoto = await resizePhoto(ev.target.result, 256);
    $('mPhotoPreview').style.backgroundImage = `url('${memberPhoto}')`;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

function resetMemberForm() {
  $('mRole').value = '팀장';
  $('mName').value = '';
  $('mPhone').value = '';
  $('mDong').value = '';
  $('mPhotoPreview').style.backgroundImage = '';
  memberPhoto = '';
  editingMemberId = null;
  $('saveMemberBtn').textContent = '+ 조직도에 추가';
  $('cancelMemberEditBtn').style.display = 'none';
  updateMemberRoleVisibility();
}
$('cancelMemberEditBtn').addEventListener('click', resetMemberForm);

$('saveMemberBtn').addEventListener('click', () => {
  if (!teams.length) { showToast('먼저 팀을 추가해주세요.', true); return; }
  const name = $('mName').value.trim();
  if (!name) { showToast('이름을 입력해주세요.', true); return; }
  const role = $('mRole').value;
  const entry = {
    id: editingMemberId || nextMemberId++,
    teamId: Number($('mTeam').value),
    role,
    name,
    phone: $('mPhone').value.trim(),
    dong: role === '팀원' ? $('mDong').value.split(',').map(s => s.trim()).filter(Boolean) : [],
    photo: memberPhoto,
  };
  const idx = editingMemberId ? members.findIndex(m => m.id === editingMemberId) : -1;
  if (idx !== -1) {
    // 사진을 새로 선택하지 않았으면 기존 사진 유지
    if (!memberPhoto) entry.photo = members[idx].photo;
    members[idx] = entry;
  } else {
    // 신규이거나, 편집 중 목록에서 삭제된 경우 새로 추가
    members.push(entry);
  }
  resetMemberForm();
  render();
});

function editMember(id) {
  const m = members.find(x => x.id === id);
  if (!m) return;
  if (pendingDeleteId !== null) { pendingDeleteId = null; clearTimeout(pendingDeleteTimer); }
  editingMemberId = id;
  renderMemberTeamOptions();
  $('mTeam').value = String(m.teamId);
  $('mRole').value = m.role;
  $('mName').value = m.name;
  $('mPhone').value = m.phone;
  $('mDong').value = m.dong.join(', ');
  memberPhoto = m.photo;
  $('mPhotoPreview').style.backgroundImage = m.photo ? `url('${m.photo}')` : '';
  $('saveMemberBtn').textContent = '✓ 수정 완료';
  $('cancelMemberEditBtn').style.display = 'block';
  updateMemberRoleVisibility();

  const formArea = $('editFormArea');
  formArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
  formArea.classList.add('editing-highlight');
  setTimeout(() => formArea.classList.remove('editing-highlight'), 1400);
}

function deleteMember(id) {
  if (pendingDeleteId === id) {
    clearTimeout(pendingDeleteTimer);
    pendingDeleteId = null;
    const target = members.find(m => m.id === id);
    members = members.filter(m => m.id !== id);
    render();
    if (target) showToast(`'${target.name}' 삭제되었습니다.`);
    return;
  }
  pendingDeleteId = id;
  renderPersonList();
  showToast('한 번 더 누르면 삭제됩니다.', true);
  clearTimeout(pendingDeleteTimer);
  pendingDeleteTimer = setTimeout(() => {
    pendingDeleteId = null;
    renderPersonList();
  }, 3000);
}

function moveMember(id, dir) {
  const idx = members.findIndex(m => m.id === id);
  if (idx === -1) return;
  const target = idx + dir;
  if (target < 0 || target >= members.length) return;
  [members[idx], members[target]] = [members[target], members[idx]];
  if (pendingDeleteId !== null) { pendingDeleteId = null; clearTimeout(pendingDeleteTimer); }
  render();
}

function renderPersonList() {
  const wrap = $('personList');
  wrap.innerHTML = '';
  $('countLabel').textContent = members.length;
  if (!members.length) {
    wrap.innerHTML = '<div class="hint-note">아직 구성원이 없습니다. 팀을 만든 뒤 추가하세요.</div>';
    return;
  }
  const teamName = (tid) => { const t = teams.find(x => x.id === tid); return t ? t.name : '(삭제된 팀)'; };
  members.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'person-row';
    const isPending = pendingDeleteId === m.id;
    const sp = safePhoto(m.photo);
    row.innerHTML = `
      <div class="thumb" style="${sp ? `background-image:url('${sp}')` : ''}"></div>
      <div class="meta">
        <div class="nm">${esc(m.name)}</div>
        <div class="rl">${esc(m.role)} · ${esc(teamName(m.teamId))}</div>
      </div>
      <div class="row-actions">
        <button onclick="moveMember(${m.id}, -1)" title="위로" aria-label="${esc(m.name)} 위로 이동" ${i === 0 ? 'disabled' : ''}>▲</button>
        <button onclick="moveMember(${m.id}, 1)" title="아래로" aria-label="${esc(m.name)} 아래로 이동" ${i === members.length - 1 ? 'disabled' : ''}>▼</button>
        <button onclick="editMember(${m.id})" title="수정" aria-label="${esc(m.name)} 수정">✎</button>
        <button onclick="deleteMember(${m.id})" title="${isPending ? '한번 더 누르면 삭제' : '삭제'}" aria-label="${esc(m.name)} 삭제" class="${isPending ? 'delete-confirm-btn' : ''}">${isPending ? '삭제확인' : '✕'}</button>
      </div>`;
    wrap.appendChild(row);
  });
}

// 조직도에 문제가 될 수 있는 상황을 좌측 패널에 경고 (이미지에는 미포함)
function renderWarnings() {
  const w = $('warnArea');
  const msgs = [];
  teams.forEach(t => {
    const leads = members.filter(m => m.role === '팀장' && m.teamId === t.id);
    if (leads.length > 1) {
      msgs.push(`'${t.name}' 팀에 팀장이 ${leads.length}명입니다. 조직도에는 1명만 표시됩니다.`);
    }
  });
  if (!msgs.length) { w.style.display = 'none'; w.innerHTML = ''; return; }
  w.style.display = 'block';
  w.innerHTML = msgs.map(m => `<div>⚠ ${esc(m)}</div>`).join('');
}

function renderChart() {
  const deptName = $('deptName').value.trim() || '과 이름 미입력';
  $('chartDeptName').textContent = deptName;
  const hasHead = !!head.name.trim();
  $('chartMeta').textContent = `총 인원 ${members.length + (hasHead ? 1 : 0)}명`;

  if (!hasHead && teams.length === 0) {
    $('chartBody').innerHTML = `<div class="empty-note">좌측 패널에서 과장과 팀을 추가하면<br>여기에 조직도가 자동으로 그려집니다.</div>`;
    return;
  }

  let html = '';

  if (hasHead) {
    html += `
      <div class="head-row">
        <div class="card-person card-head">
          <div class="p-role role-과장">과장</div>
          <div class="p-name" title="${esc(head.name)}">${esc(head.name)}</div>
          <div class="p-phone" title="${esc(head.phone || '')}">${esc(head.phone) || '-'}</div>
          <div class="avatar" ${avatarStyle(head.photo)}></div>
        </div>
      </div>`;
    if (teams.length) html += `<div class="connector-v"></div><div class="h-bridge"></div>`;
  }

  if (teams.length) {
    html += `<div class="teams-row">`;
    teams.forEach(team => {
      const color = teamColor(team.name);
      const lead = members.find(m => m.role === '팀장' && m.teamId === team.id);
      const mem = members.filter(m => m.role === '팀원' && m.teamId === team.id);
      html += `<div class="team-col" style="border-top:3px solid ${color};padding-top:16px;">`;
      html += `<div class="team-label" style="color:${color};" title="${esc(team.name)}"><span class="team-dot" style="background:${color};"></span>${esc(team.name)}</div>`;
      if (lead) {
        html += `
          <div class="card-person card-lead" style="border-color:${color};border-width:1.5px;">
            <div class="p-name" title="${esc(lead.name)}">${esc(lead.name)}</div>
            <div class="p-phone" title="${esc(lead.phone || '')}">${esc(lead.phone) || '-'}</div>
            <div class="avatar" ${avatarStyle(lead.photo)}></div>
          </div>`;
      } else {
        html += `
          <div class="card-person card-lead" style="border-style:dashed;color:var(--muted);">
            <div class="p-name" style="color:var(--muted)">팀장 공석</div>
          </div>`;
      }
      if (mem.length) {
        html += `<div class="lead-connector" style="background:${color};"></div><div class="members-list">`;
        mem.forEach(m => {
          html += `
            <div class="card-person card-member" style="border-left:3px solid ${color};">
              <div class="p-name" style="font-size:13.5px;" title="${esc(m.name)}">${esc(m.name)}</div>
              <div class="p-phone" title="${esc(m.phone || '')}">${esc(m.phone) || '-'}</div>
              <div class="avatar" ${avatarStyle(m.photo, 'width:44px;height:44px;margin:7px auto;')}></div>
              ${m.dong.length ? `<div class="p-dong">${m.dong.map(d => `<span class="dong-tag" style="border-color:${color};color:${color};">${esc(d)}</span>`).join('')}</div>` : ''}
            </div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  }

  $('chartBody').innerHTML = html;
}

function render() {
  renderTeamList();
  renderMemberTeamOptions();
  renderPersonList();
  renderChart();
  renderWarnings();
  saveState();
}

// 조직도 이미지를 A4 페이지에 비율 유지로 배치해 숨김 iframe에서 인쇄
function printImageOnA4(dataUrl, wmm, hmm) {
  const old = $('printFrame');
  if (old) old.remove();
  const frame = document.createElement('iframe');
  frame.id = 'printFrame';
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(frame);
  const doc = frame.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>조직도 출력</title>
    <style>
      @page { size: A4 landscape; margin: 10mm; }
      html, body { margin: 0; padding: 0; }
      img { display: block; margin: 0 auto; width: ${wmm}mm; height: ${hmm}mm; }
    </style></head>
    <body><img src="${dataUrl}"></body></html>`);
  doc.close();
  const img = doc.querySelector('img');
  const go = () => { frame.contentWindow.focus(); frame.contentWindow.print(); };
  if (img.complete) setTimeout(go, 50); else img.onload = () => setTimeout(go, 50);
}

$('printBtn').addEventListener('click', () => {
  const btn = $('printBtn');

  btn.textContent = '준비 중...';
  btn.disabled = true;
  html2canvas($('chart'), { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
    // A4 가로 인쇄영역(여백 10mm 제외): 277 x 190 mm 안에 비율 유지하며 맞춤
    const pageW = 277, pageH = 190;
    const ar = canvas.width / canvas.height;
    let w = pageW, h = pageW / ar;
    if (h > pageH) { h = pageH; w = pageH * ar; }
    printImageOnA4(canvas.toDataURL('image/png'), Math.round(w * 10) / 10, Math.round(h * 10) / 10);
  }).catch(err => {
    showToast('출력 준비에 실패했습니다. 다시 시도해주세요.', true);
  }).finally(() => {
    btn.textContent = label;
    btn.disabled = false;
  });
});

// ===== 초기화 =====
restoreState();
syncHeadFields();
updateMemberRoleVisibility();
render();
</script>

</body>
</html>
